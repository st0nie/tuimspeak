[package]
name = "tuim-audio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Audio I/O sidecar for tuimspeak: microphone capture and speaker playback over stdio"

[dependencies]
cpal = "0.18"
ringbuf = "0.4"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# On Linux, cpal's default host prefers PulseAudio (which PipeWire also
# serves via pipewire-pulse) when this feature is on, falling back to ALSA.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

[profile.release]
lto = "thin"
